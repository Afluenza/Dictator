name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux display for Tk tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m spacy download en_core_web_sm
      - name: Test
        # -rs prints every skip with its reason, so a platform gap is visible in the log.
        run: python -m pytest -q -rs -p no:cacheprovider
        if: runner.os != 'Linux'
      - name: Test (Linux, under a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q -rs -p no:cacheprovider
